<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayerSub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0f172a; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        .page { display: none; padding-bottom: 80px; }
        .page.active { display: block; }
        .game-card { 
            background: #1e293b; 
            transition: all 0.2s;
            border: 1px solid #334155;
        }
        .game-card:active { transform: scale(0.95); background: #334155; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .nav-btn { transition: all 0.2s; }
        .nav-btn.active { color: #a78bfa; }
        .nav-btn.active svg { fill: #a78bfa; }
        .pack-card { 
            background: #1e293b; 
            border: 2px solid #334155;
            transition: all 0.2s;
        }
        .pack-card:active { border-color: #8b5cf6; background: #2d3748; }
        .pack-card.selected { border-color: #8b5cf6; background: #2d3748; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ASOSIY SAHIFA -->
    <div id="page-home" class="page active">
        <!-- Header -->
        <div class="p-4 flex items-center justify-between bg-slate-900 sticky top-0 z-10 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center font-bold text-lg" id="avatar">P</div>
                <div>
                    <p class="text-xs text-slate-400">Salom 👋</p>
                    <p class="font-bold" id="username">Yuklanmoqda...</p>
                </div>
            </div>
            <button onclick="toggleTheme()" class="bg-slate-800 p-2 rounded-lg text-xl">🌙</button>
        </div>

        <!-- Balans -->
        <div class="p-4">
            <div class="gradient-bg p-5 rounded-2xl shadow-lg">
                <p class="text-sm text-purple-100 font-medium">UMUMIY BALANS</p>
                <p class="text-3xl font-bold mt-1" id="user-balance">0 <span class="text-lg text-purple-200">so'm</span></p>
                <button onclick="navigateTo('topup')" class="mt-4 bg-white text-purple-600 px-6 py-2.5 rounded-xl font-bold text-sm w-full">
                    ➕ Balansni to'ldirish
                </button>
            </div>
        </div>

        <!-- Promokod va Yordam -->
        <div class="px-4 grid grid-cols-2 gap-3 mb-4">
            <button onclick="showAlert('Promokodlar tez orada!')" class="bg-slate-800 p-3 rounded-xl flex items-center justify-center gap-2 border border-slate-700">
                <span>🎫</span>
                <span class="font-medium text-sm">Promokodlar</span>
            </button>
            <button onclick="showAlert('Yordam tez orada!')" class="bg-slate-800 p-3 rounded-xl flex items-center justify-center gap-2 border border-slate-700">
                <span>🎧</span>
                <span class="font-medium text-sm">Yordam</span>
            </button>
        </div>

        <!-- Banner -->
        <div class="px-4 mb-4">
            <div class="bg-gradient-to-r from-purple-900 to-indigo-900 rounded-2xl p-6 relative overflow-hidden border border-purple-700">
                <div class="relative z-10">
                    <h3 class="text-2xl font-bold mb-1">ENG TEZ</h3>
                    <h3 class="text-3xl font-bold text-purple-300 mb-2">ARZON UC</h3>
                    <p class="text-sm opacity-80">XIZMATIMIZ</p>
                </div>
            </div>
        </div>

        <!-- O'yinlar -->
        <div class="px-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-lg">🔥 Ommabop o'yinlar</h2>
                <button onclick="navigateTo('games')" class="text-purple-400 font-medium text-sm">Barchasi →</button>
            </div>
            <div class="grid grid-cols-3 gap-3" id="popular-games"></div>
        </div>
    </div>

    <!-- O'YINLAR SAHIFASI -->
    <div id="page-games" class="page">
        <div class="p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
            <h1 class="text-xl font-bold">Barcha o'yinlar</h1>
            <input type="text" placeholder="O'yin qidirish..." class="mt-3 w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm" oninput="searchGames(this.value)">
        </div>
        <div class="p-4 grid grid-cols-3 gap-3" id="all-games"></div>
    </div>

    <!-- O'YIN TANLOV SAHIFASI -->
    <div id="page-game-detail" class="page">
        <div class="relative h-48 bg-gradient-to-b from-purple-600 to-slate-900 flex items-center justify-center">
            <button onclick="navigateTo('home')" class="absolute top-4 left-4 bg-black/30 p-2 rounded-full">←</button>
            <div class="text-center">
                <div class="text-6xl mb-2" id="detail-icon">🎮</div>
                <h1 class="text-2xl font-bold" id="detail-name">O'yin</h1>
            </div>
        </div>
        <div class="p-4">
            <h2 class="font-bold text-lg mb-3">Paketni tanlang</h2>
            <div id="packages-list" class="space-y-3"></div>
            <button onclick="buyPackage()" class="mt-4 w-full gradient-bg py-3 rounded-xl font-bold">Sotib olish</button>
        </div>
    </div>

    <!-- BALANS TO'LDIRISH -->
    <div id="page-topup" class="page">
        <div class="p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-10 flex items-center gap-3">
            <button onclick="navigateTo('home')" class="text-2xl">←</button>
            <h1 class="text-xl font-bold">Balansni to'ldirish</h1>
        </div>
        <div class="p-4">
            <div class="bg-slate-800 p-4 rounded-xl mb-4">
                <p class="text-sm text-slate-400">Hozirgi balans</p>
                <p class="text-2xl font-bold" id="topup-balance">0 so'm</p>
            </div>
            <div class="space-y-3">
                <button onclick="selectPayment('click')" class="w-full bg-blue-600 p-4 rounded-xl flex items-center gap-3">
                    <span class="text-2xl">💳</span>
                    <div class="text-left">
                        <p class="font-bold">Click</p>
                        <p class="text-xs text-blue-200">Tez va qulay</p>
                    </div>
                </button>
                <button onclick="selectPayment('payme')" class="w-full bg-purple-600 p-4 rounded-xl flex items-center gap-3">
                    <span class="text-2xl">💰</span>
                    <div class="text-left">
                        <p class="font-bold">Payme</p>
                        <p class="text-xs text-purple-200">Onlayn to'lov</p>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- BUYURTMALAR -->
    <div id="page-orders" class="page">
        <div class="p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
            <h1 class="text-xl font-bold">Buyurtmalarim</h1>
        </div>
        <div class="p-4">
            <div class="bg-slate-800 p-6 rounded-xl text-center text-slate-400">
                <p class="text-4xl mb-2">📦</p>
                <p>Buyurtmalar yo'q</p>
            </div>
        </div>
    </div>

    <!-- PROFIL -->
    <div id="page-profile" class="page">
        <div class="p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
            <h1 class="text-xl font-bold">Profil</h1>
        </div>
        <div class="p-4 space-y-3">
            <div class="bg-slate-800 p-4 rounded-xl">
                <p class="text-sm text-slate-400">Ism</p>
                <p class="font-bold" id="profile-name">-</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl">
                <p class="text-sm text-slate-400">Telegram ID</p>
                <p class="font-bold" id="profile-id">-</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl">
                <p class="text-sm text-slate-400">Balans</p>
                <p class="font-bold text-purple-400" id="profile-balance">0 so'm</p>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-2 z-20">
        <div class="flex justify-around">
            <button onclick="navigateTo('home')" class="nav-btn active flex flex-col items-center gap-1 p-2" data-page="home">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
                <span class="text-xs">Asosiy</span>
            </button>
            <button onclick="navigateTo('games')" class="nav-btn flex flex-col items-center gap-1 p-2" data-page="games">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M13 7h4v2h-4V7zM3 7h4v2H3V7zm10 6h4v2h-4v-2zM3 13h4v2H3v-2z"/></svg>
                <span class="text-xs">O'yinlar</span>
            </button>
            <button onclick="navigateTo('topup')" class="nav-btn flex flex-col items-center gap-1 p-2" data-page="topup">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"/><path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clip-rule="evenodd"/></svg>
                <span class="text-xs">To'ldirish</span>
            </button>
            <button onclick="navigateTo('orders')" class="nav-btn flex flex-col items-center gap-1 p-2" data-page="orders">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 4a3 3 0 00-3 3v6a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3H5zm-1 9v-1h5v2H5a1 1 0 01-1-1zm7 1h4a1 1 0 001-1v-1h-5v2zm0-4h5V8h-5v2zM9 8H4v2h5V8z" clip-rule="evenodd"/></svg>
                <span class="text-xs">Buyurtmalar</span>
            </button>
            <button onclick="navigateTo('profile')" class="nav-btn flex flex-col items-center gap-1 p-2" data-page="profile">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
                <span class="text-xs">Profil</span>
            </button>
        </div>
    </div>

    <script>
        // Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f172a');
        tg.setBackgroundColor('#0f172a');

        const user = tg.initDataUnsafe?.user;
        let currentUser = { id: 0, name: '', balance: 0 };
        let selectedGame = null;
        let selectedPackage = null;

        // O'yinlar ro'yxati
        const games = [
            { id: 1, name: 'PUBG Mobile', icon: '🎯', currency: 'UC', popular: true },
            { id: 2, name: 'Free Fire', icon: '', currency: 'Diamonds', popular: true },
            { id: 3, name: 'Mobile Legends', icon: '⚔️', currency: 'Diamonds', popular: true },
            { id: 4, name: 'Honor of Kings', icon: '👑', currency: 'Coins', popular: true },
            { id: 5, name: 'Stand Off 2', icon: '🔫', currency: 'Gold', popular: true },
            { id: 6, name: 'Steam', icon: '🎮', currency: 'Wallet', popular: true },
            { id: 7, name: 'Telegram Stars', icon: '⭐', currency: 'Stars', popular: false },
            { id: 8, name: 'Brawl Stars', icon: '💥', currency: 'Gems', popular: false },
            { id: 9, name: 'Clash Royale', icon: '🏰', currency: 'Gems', popular: false }
        ];

        // Paketlar (har bir o'yin uchun)
        const packages = {
            1: [ // PUBG
                { amount: 341, price: 34000 },
                { amount: 572, price: 50000 },
                { amount: 1166, price: 107000 },
                { amount: 2398, price: 205000 },
                { amount: 6160, price: 500000 }
            ],
            2: [ // Free Fire
                { amount: 100, price: 10000 },
                { amount: 310, price: 30000 },
                { amount: 520, price: 50000 },
                { amount: 1060, price: 100000 },
                { amount: 2180, price: 200000 }
            ],
            3: [ // Mobile Legends
                { amount: 5, price: 5000 },
                { amount: 12, price: 12000 },
                { amount: 50, price: 50000 },
                { amount: 72, price: 70000 },
                { amount: 145, price: 140000 }
            ]
        };

        // Sahifa o'zgartirish
        function navigateTo(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageName).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.nav-btn[data-page="${pageName}"]`)?.classList.add('active');
            
            if (pageName === 'profile') loadProfile();
        }

        // O'yinlarni ko'rsatish
        function renderGames() {
            const popularContainer = document.getElementById('popular-games');
            const allContainer = document.getElementById('all-games');
            
            games.filter(g => g.popular).forEach(game => {
                popularContainer.innerHTML += createGameCard(game);
            });
            
            games.forEach(game => {
                allContainer.innerHTML += createGameCard(game);
            });
        }

        function createGameCard(game) {
            return `
                <div class="game-card p-3 rounded-xl flex flex-col items-center gap-2 cursor-pointer" onclick="openGame(${game.id})">
                    <div class="text-3xl">${game.icon}</div>
                    <span class="text-xs font-medium text-center leading-tight">${game.name}</span>
                </div>
            `;
        }

        function openGame(gameId) {
            selectedGame = games.find(g => g.id === gameId);
            document.getElementById('detail-name').textContent = selectedGame.name;
            document.getElementById('detail-icon').textContent = selectedGame.icon;
            
            const packs = packages[gameId] || [
                { amount: 100, price: 10000 },
                { amount: 500, price: 50000 },
                { amount: 1000, price: 100000 }
            ];
            
            const container = document.getElementById('packages-list');
            container.innerHTML = '';
            packs.forEach((pack, idx) => {
                container.innerHTML += `
                    <div class="pack-card p-4 rounded-xl flex justify-between items-center cursor-pointer" onclick="selectPackage(${idx})">
                        <div>
                            <p class="font-bold text-lg">${pack.amount} ${selectedGame.currency}</p>
                            <p class="text-sm text-slate-400">${pack.price.toLocaleString()} so'm</p>
                        </div>
                        <div class="w-6 h-6 rounded-full border-2 border-slate-500" id="pack-${idx}"></div>
                    </div>
                `;
            });
            
            navigateTo('game-detail');
        }

        function selectPackage(idx) {
            document.querySelectorAll('.pack-card').forEach(c => c.classList.remove('selected'));
            document.querySelectorAll('[id^="pack-"]').forEach(d => d.innerHTML = '');
            
            event.currentTarget.classList.add('selected');
            event.currentTarget.querySelector('[id^="pack-"]').innerHTML = '✓';
            selectedPackage = idx;
        }

        function buyPackage() {
            if (selectedPackage === null) {
                showAlert('Paketni tanlang!');
                return;
            }
            showAlert('Buyurtma qabul qilindi! Tez orada amalga oshiriladi.');
            navigateTo('orders');
        }

        function searchGames(query) {
            // Qidiruv funksiyasi
        }

        function selectPayment(method) {
            showAlert(method.toUpperCase() + ' orqali to\'lov tez orada qo\'shiladi!');
        }

        function loadProfile() {
            if (user) {
                document.getElementById('profile-name').textContent = user.first_name;
                document.getElementById('profile-id').textContent = user.id;
                document.getElementById('username').textContent = user.first_name;
                document.getElementById('avatar').textContent = user.first_name[0];
            }
            document.getElementById('profile-balance').textContent = currentUser.balance.toLocaleString() + ' so\'m';
            document.getElementById('topup-balance').textContent = currentUser.balance.toLocaleString() + ' so\'m';
        }

        function showAlert(msg) {
            tg.showAlert(msg);
        }

        function toggleTheme() {
            showAlert('Mavzu o\'zgartirish tez orada!');
        }

        // Init
        renderGames();
        loadProfile();
    </script>
</body>
  </html>
